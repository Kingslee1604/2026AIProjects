title = "AgentForge gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Dependency, build, and environment directories"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.git/''',
  '''(^|/)uv\.lock$''',
  '''(^|/)pnpm-lock\.yaml$''',
  # Git-ignored build output: Next.js writes per-build preview keys into .next/; SBOMs and
  # browser-test traces are generated artifacts.
  '''(^|/)\.next/''',
  '''(^|/)build/sbom/''',
  '''(^|/)test-results/''',
]
