packages:
  - "apps/*"

# Supply-chain policy: only install versions published at least 14 days ago (minutes).
minimumReleaseAge: 20160

# Exceptions: security fixes may be adopted before they are 14 days old. Exact versions only,
# each with its reason. Remove an entry once the version is older than the window.
minimumReleaseAgeExclude:
  # GHSA-2464-fhr4-w9xw and GHSA-673q-mjm6-r5xr (CRITICAL, RCE) and GHSA-p3m5-59mp-jv5r (HIGH,
  # DoS), fixed in 16.4.1. Published 2026-10-14, adopted 2026-10-22; found by OSV-Scanner. Low
  # exposure here (image optimization is off; no `use cache`, no Server Actions), but critical.
  # The release spans the next, @next/*, and eslint-config-next packages, all at exactly 16.4.1.
  - next@16.4.1
  - eslint-config-next@16.4.1
  - "@next/env@16.4.1"
  - "@next/eslint-plugin-next@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  # GHSA-cg2g-xh64-v4q7 (CRITICAL) and two more in dompurify, fixed in 3.4.17 (2026-10-12);
  # reached only through mermaid (docs diagram checks, never shipped); found by OSV-Scanner.
  - dompurify@3.4.17
  # GHSA-mrhx-c7xc-m3w5 (HIGH) in zod 4.6.5, fixed in 4.6.6 (2026-10-11); reached only through
  # eslint-plugin-react-hooks (lint tooling, never shipped); found by OSV-Scanner, 2026-10-23.
  - zod@4.6.6
  # GHSA-xjj6-f33q-929c (HIGH) and two more in undici 8.11.2, fixed in 8.12.2 (2026-10-15);
  # reached only through jsdom (unit tests, never shipped); found by OSV-Scanner, 2026-10-27.
  - undici@8.12.2

# Optional dependencies we deliberately do not install.
ignoredOptionalDependencies:
  # Next.js image optimization (disabled in next.config.ts); its libvips binary is LGPL-3.0.
  - sharp

# Force patched versions of vulnerable transitive dependencies (found by OSV-Scanner).
overrides:
  lodash-es: ">=4.18.1" # GHSA-f23m-r3pf-42rh, GHSA-r5fr-rjxr-66jc (via mermaid, docs tooling)
  katex: ">=0.18.2" # GHSA-238p-pmpm-9mq7 (via mermaid, docs tooling)
  source-map-js: ">=1.2.2" # GHSA-68fv-2mgg-jv7q (via postcss)
  dompurify: ">=3.4.17" # GHSA-cg2g-xh64-v4q7 and others (via mermaid, docs tooling)
  zod: ">=4.6.6 <5" # GHSA-mrhx-c7xc-m3w5 (via eslint-plugin-react-hooks, lint tooling)
  undici: ">=8.12.2 <9" # GHSA-xjj6-f33q-929c and others (via jsdom, unit tests)

# Dependency install scripts are blocked unless listed here as true (pnpm default).
allowBuilds:
  # eslint's resolver ships its native binary as a platform package; the script is a fallback.
  unrs-resolver: false
