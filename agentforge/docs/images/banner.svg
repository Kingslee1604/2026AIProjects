<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="AgentForge: answers your auditors can verify. Self-hosted AI agents with verified citations, durable runs, and human review.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1c"/>
      <stop offset="1" stop-color="#151236"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5bf0"/>
      <stop offset="1" stop-color="#a03ce6"/>
    </linearGradient>
    <linearGradient id="brandText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5a8ff"/>
      <stop offset="1" stop-color="#d49bff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="300" rx="20" fill="url(#glow1)"/>
  <rect width="1280" height="300" rx="20" fill="url(#glow2)"/>

  <!-- Logo mark (the same hexagon, anvil and spark as the app) -->
  <g transform="translate(80 76) scale(4.6)">
    <path d="M16 2.5 27.5 9v14L16 29.5 4.5 23V9z" fill="url(#brand)" stroke="#ffffff" stroke-opacity="0.25" stroke-linejoin="round"/>
    <path d="M9 13.5h11.5c0 2.3-1.6 3.6-3.5 4v2.2h2.2v2.3H11.6v-2.3h2.2v-2.2c-2.3-.4-4.8-1.8-4.8-4z" fill="#ffffff"/>
    <path d="M23 8.2l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" fill="#ffffff"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="262" y="128" font-size="64" font-weight="700" fill="#f4f3ff">Agent<tspan fill="url(#brandText)">Forge</tspan></text>
    <text x="264" y="178" font-size="30" font-weight="500" fill="#d7d4f5">Answers your auditors can verify.</text>
    <text x="264" y="222" font-size="20" fill="#a9a5cf">Self-hosted AI agents · verified citations · durable runs · human review · runs on a laptop</text>
  </g>

  <!-- A small "Verified" badge, as in the app -->
  <g transform="translate(1050 92)">
    <rect width="150" height="40" rx="20" fill="#16a34a" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.6"/>
    <circle cx="26" cy="20" r="8" fill="none" stroke="#4ade80" stroke-width="2"/>
    <path d="M22 20.5l3 3 5-6" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="27" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#86efac">Verified</text>
  </g>
</svg>
