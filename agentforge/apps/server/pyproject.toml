[project]
name = "agentforge"
version = "0.0.0"
description = "Self-hostable platform for evidence-grounded, human-supervised AI workflows over private documents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "dbos>=3.1.0",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "openpyxl>=3.1.5",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
agentforge = "agentforge.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
